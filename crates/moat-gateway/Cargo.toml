[package]
name = "moat-gateway"
description = "The Moat MCP proxy binary: wires transports to the policy core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "moat-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.5.61", features = ["derive"] }
deadpool-postgres = "0.14.1"
futures = "0.3.34"
moat-core = { version = "0.1.0", path = "../moat-core" }
moat-mcp.workspace = true
rand = "0.10.0"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal", "net"] }
tokio-stream = "0.1.19"
tokio-postgres = { version = "0.7.16", features = ["with-serde_json-1"] }
time = { version = "0.3.44", features = ["parsing", "formatting"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hex = "0.4.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "builder"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
