[package]
name = "moat-gateway"
description = "The Moat MCP proxy binary: wires transports to the policy core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "moat-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
futures = "0.3.34"
moat-core.workspace = true
moat-mcp.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
