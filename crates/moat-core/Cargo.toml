[package]
name = "moat-core"
description = "Provenance model, policy evaluation, verdicts and evidence for Moat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.20"
time = { version = "0.3.44", features = ["formatting"] }

[dev-dependencies]
