[package]
name = "moat-mcp"
description = "MCP JSON-RPC types and transport framing. No policy logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "process", "sync", "rt", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
