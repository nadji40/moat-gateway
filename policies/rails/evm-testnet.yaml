version: 1

# The policy in front of the real Base Sepolia wallet.
#
# It is rails/evm.yaml with the address book taken out. Nothing is approved
# in advance: every payment has to be authorized through the intent API,
# with a payee, an address, an amount, an asset and a chain, and the
# demonstration is that a real transaction goes out exactly when all five
# match and never otherwise. An allowlist would let a payment through on
# the strength of a file, which is a weaker thing to show than a payment
# going through on the strength of what the user agreed to.
#
# The cap is a bare number and applies to whatever unit is sent -- ether
# or USDC alike -- because a per-asset cap is not built. It is set for
# ether, and the token payment in the smoke script is sized under it.

payment_tools:
  - server: "*"
    tool: "send"

fields:
  payee:       { args: ["counterparty"] }
  amount:      { args: ["amount"] }
  currency:    { args: ["token"] }
  destination: { kind: destination, args: ["to_address"] }
  network:     { args: ["network"] }

allowlist:
  payees: []
  accounts: []

rules:
  - id: payee-provenance
    when: field == payee
    require_source: [User]
    on_fail: step_up
    message: "counterparty label did not come from the user"

  - id: destination-provenance
    when: field == destination
    require_source: [User]
    on_fail: deny
    message: "destination address did not come from the user"

  - id: amount-cap
    when: field == amount
    max: 0.01
    on_fail: deny
    message: "amount exceeds the testnet cap"

  - id: amount-provenance
    when: field == amount
    require_source: [User, ToolResult]
    on_fail: step_up

velocity:
  max_calls_per_session: 20
  max_calls_per_minute: 10
  on_exceed: deny

no_human_available: deny
