version: 1

# The policy in front of the Moat-guarded wallet.
#
# rails/evm-testnet.yaml with one change: the payment tool is `propose`
# rather than `send`. On this path Moat does not stand between the agent
# and the money -- the contract does. `propose` moves nothing; an allow
# here is what POST /v1/session/{id}/cosign turns into the signature
# MoatGuardedWallet demands, and a deny simply never becomes one. ADR 0010.
#
# Everything else is deliberately identical, so that a verdict on the
# guarded path is reached by exactly the code a verdict on the unguarded
# path is reached by.

payment_tools:
  - server: "*"
    tool: "propose"

# Tools that move no money. A tool in neither list is refused and hidden
# from the agent, so a server that grows a new way to pay cannot pay around
# Moat.
non_payment_tools:
  - server: "wallet"
    tool: "get_transaction"
  - server: "wallet"
    tool: "balances"
  - server: "wallet"
    tool: "inspect_wallet"

fields:
  payee:       { args: ["counterparty"] }
  amount:      { args: ["amount"] }
  currency:    { args: ["token"] }
  destination: { kind: destination, args: ["to_address"] }
  network:     { args: ["network"] }
  # The contract or mint the wallet is told to move. An authorization for
  # a token names one, and a payment that names another, or none, is
  # denied: a ticker is a label any contract can wear.
  asset_contract: { args: ["token_address", "mint"] }

allowlist:
  payees: []
  accounts: []

rules:
  - id: payee-provenance
    when: field == payee
    # The name beside an address is a label nothing on chain checks. A
    # payment that gives one must give the right one; a payment that gives
    # none is judged by the destination rule, which is the one that matters.
    optional: true
    require_source: [User]
    on_fail: step_up
    message: "counterparty label did not come from the user"

  - id: destination-provenance
    when: field == destination
    require_source: [User]
    on_fail: deny
    message: "destination address did not come from the user"

  - id: amount-cap
    when: field == amount
    max: 0.01
    on_fail: deny
    message: "amount exceeds the testnet cap"

  - id: amount-provenance
    when: field == amount
    require_source: [User, ToolResult]
    on_fail: step_up

velocity:
  max_calls_per_session: 20
  max_calls_per_minute: 10
  on_exceed: deny

no_human_available: deny
