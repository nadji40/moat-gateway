version: 1

# Evaluation arm "allowlist": approved payees and nothing else. The same two
# payees default.yaml allows, but no provenance, no cap, no velocity and no
# knowledge of what the user asked for. A payment to an approved name goes
# through whatever the amount and whoever suggested it.
# The runner registers no intent and no authorization when running this arm.

payment_tools:
  - server: "*"
    tool: "pay"
  - server: "stripe"
    tool: "create_payment"

fields:
  payee:    { args: ["payee", "recipient", "destination", "to"] }
  amount:   { args: ["amount", "total", "value"] }
  currency: { args: ["currency"] }

allowlist:
  payees:
    - "Acme Cloud Ltd"
    - "Monitoring Pro Inc"

rules:
  - id: payee-allowlist
    when: field == payee
    require_source: [Allowlist]
    on_fail: deny
    message: "payee is not on the allowlist"

no_human_available: deny
