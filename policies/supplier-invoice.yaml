version: 1

payment_tools:
  - server: "stripe"
    tool: "pay"

# Tools that move no money. A tool in neither list is refused and hidden
# from the agent, so a server that grows a new way to pay cannot pay around
# Moat.
non_payment_tools:
  - server: "stripe"
    tool: "list_payments"
  - server: "stripe"
    tool: "inspect_accounts"

fields:
  payee:    { args: ["payee"] }
  amount:   { args: ["amount"] }
  currency: { args: ["currency"] }

allowlist:
  payees:
    - "Monitoring Pro Inc"

rules:
  - id: payee-provenance
    when: field == payee
    require_source: [User, Allowlist]
    on_fail: step_up
    message: "recipient was not approved by the user"

  - id: absolute-spending-cap
    when: field == amount
    max: 500
    on_fail: deny
    message: "amount exceeds the workflow's absolute spending cap"

  - id: amount-provenance
    when: field == amount
    require_source: [User, Allowlist, ToolResult]
    on_fail: step_up

velocity:
  max_calls_per_session: 50
  max_calls_per_minute: 30
  # Payments without an approval are also capped in total: the same amount
  # split into pieces under the per-payment cap stops adding up here.
  max_amount_per_session: 1000
  on_exceed: deny

# The caps above are in US dollars. Every payment is valued in dollars
# before it meets them, so 500 means the same in riyals as in dinars. A
# currency with no rate here fails the caps rather than passing them.
# Rates from Dhoha's limits table, 2 October 2026; update them before
# relying on them, because a stale rate moves the cap with it.
fx:
  base: USD
  rates:
    EUR: 1.133
    SAR: 0.2667
    AED: 0.2723
    QAR: 0.2747
    OMR: 2.601
    BHD: 2.66
    KWD: 3.258
    EGP: 0.0202
    DZD: 0.00747
    INR: 0.01042
    JPY: 0.00633

no_human_available: deny
