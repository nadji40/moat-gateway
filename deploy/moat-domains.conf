<VirtualHost 72.62.47.83:443>
    ServerName moatgateway.dpdns.org
    DocumentRoot /var/www/moat-domain
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader unset X-Forwarded-For
    RequestHeader unset CF-Connecting-IP
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/moat-domain/.well-known/acme-challenge/
    <Directory /var/www/moat-domain>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.json
        AddType application/json .json
    </Directory>
    ErrorLog /usr/local/apache/logs/moat-domains-error_log
    CustomLog /usr/local/apache/logs/moat-domains-access_log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/moatgateway.dpdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/moatgateway.dpdns.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyPass / http://127.0.0.1:8787/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>

<VirtualHost 72.62.47.83:443>
    ServerName api.moatgateway.dpdns.org
    DocumentRoot /var/www/moat-domain
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader unset X-Forwarded-For
    RequestHeader unset CF-Connecting-IP
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/moat-domain/.well-known/acme-challenge/
    <Directory /var/www/moat-domain>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.json
        AddType application/json .json
    </Directory>
    ErrorLog /usr/local/apache/logs/moat-domains-error_log
    CustomLog /usr/local/apache/logs/moat-domains-access_log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/moatgateway.dpdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/moatgateway.dpdns.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyPass /mcp http://127.0.0.1:8787/mcp retry=0 timeout=300
    ProxyPassReverse /mcp http://127.0.0.1:8787/mcp
    ProxyPass /v1/ http://127.0.0.1:8787/v1/ retry=0 timeout=65
    ProxyPassReverse /v1/ http://127.0.0.1:8787/v1/
    ProxyPass /health/ http://127.0.0.1:7081/health/ retry=0 timeout=10
    ProxyPassReverse /health/ http://127.0.0.1:7081/health/
</VirtualHost>
