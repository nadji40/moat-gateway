# Managed Moat website and public API hostnames.

<VirtualHost 72.62.47.83:80>
    ServerName moatgateway.dpdns.org
    DocumentRoot /var/www/moat-domain
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader unset X-Forwarded-For
    RequestHeader unset CF-Connecting-IP
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/moat-domain/.well-known/acme-challenge/
    <Directory /var/www/moat-domain>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.json
        AddType application/json .json
    </Directory>
    ErrorLog /usr/local/apache/logs/moat-domains-error_log
    CustomLog /usr/local/apache/logs/moat-domains-access_log combined
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://moatgateway.dpdns.org%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>

