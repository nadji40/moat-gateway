listen: { transport: http, addr: "127.0.0.1:7081" }
upstreams:
  - name: stripe
    transport: stdio
    command:
      - "/opt/node22/bin/node"
      - "--env-file=/home/moat/.env.stripe-sandbox"
      - "--import"
      - "tsx"
      - "/home/moat/arena/stripe-sandbox/src/server.ts"
policy: /home/moat/policies/supplier-invoice.yaml
evidence: /var/lib/moat/evidence/evidence.jsonl
keys: /var/lib/moat/keys
intent_api: { addr: "127.0.0.1:7082" }
storage:
  database_url_env: MOAT_DATABASE_URL
  max_connections: 12
auth:
  required: true
  # This deployment is the public trial, so a stranger can create a workspace
  # and its first admin key. A pilot for one named customer leaves this off and
  # provisions that key with scripts/provision-tenant.sh instead.
  self_signup: true
# A lost admin key is mailed back as a single-use recovery key, to the address
# the owner gave at signup. The message is handed to this machine's own mail
# server (cPanel's Exim) on loopback, which signs it with the domain's DKIM
# key under /var/cpanel/domain_keys/ and delivers it.
mail:
  from: "Moat <no-reply@moatgateway.dpdns.org>"
  dashboard_url: https://moatgateway.dpdns.org/dashboard
  smtp: { host: 127.0.0.1, port: 25 }
