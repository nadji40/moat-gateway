<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moat, the nine tests</title>
<meta name="ar-title" content="moat، الاختبارات التسعة">
<meta name="description" content="Nine attacks on an agent payment, each isolating one mechanism, run live against a real gateway.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&family=Ubuntu+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css?v=cbb4282">
<link rel="stylesheet" href="i18n.css">
<link rel="stylesheet" href="footer.css">
<script src="i18n.js"></script>
<style>
/* Tests-only glass surface: leave shared cards and verdict logic untouched. */
.test.glass{
  background:
    radial-gradient(ellipse at 12% 0%, rgba(255,255,255,.085), transparent 58%),
    linear-gradient(145deg, rgba(255,255,255,.060), rgba(255,255,255,.015) 58%, rgba(255,255,255,.035));
  -webkit-backdrop-filter: blur(24px) saturate(155%);
  backdrop-filter: blur(24px) saturate(155%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 1px 0 0 rgba(255,255,255,.045),
    0 18px 40px -24px rgba(0,0,0,.86);
  transition: transform .25s var(--ease), border-color .25s, box-shadow .35s var(--ease), background .35s ease;
}
@media (hover:hover) and (pointer:fine){
  .test.glass:hover{
    background:
      radial-gradient(ellipse at 12% 0%, rgba(255,255,255,.12), transparent 60%),
      linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.025) 58%, rgba(255,255,255,.045));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.21),
      inset 1px 0 0 rgba(255,255,255,.065),
      0 26px 50px -28px rgba(0,0,0,1);
  }
}
@media (prefers-reduced-transparency: reduce){
  .test.glass{
    background:#151515;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
}
/* Right to left: the progress line under the summary fills from the reading edge. */
html[dir="rtl"] .summary .bar{left:auto;right:0}
</style>
</head>
<body>

<nav></nav>

<div class="wrap">

<header class="hero">
  <div>
    <p class="kicker" data-ar="الاختبارات">The tests</p>
    <h1 data-ar="تسع هجمات، كلٌّ منها يعزل أمرًا واحدًا">Nine attacks, each isolating one thing</h1>
    <p class="lede" data-ar="صفوف من مجموعة الاختبارات المقيسة. كلٌّ منها يعمل في بوابة خاصة به.">Rows from the measured corpus. Each runs in a gateway of its own.</p>
    <div class="row">
      <button class="btn" id="run-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <span data-ar="شغّل الاختبارات التسعة">Run all nine</span>
      </button>
      <a class="btn ghost" href="/#compose" data-ar="صمّم اختبارك">Compose your own</a>
    </div>
  </div>
</header>

<section id="suite" class="tight">
  <div class="summary glass" id="summary" hidden><span class="bar"></span></div>
  <div class="tests" id="tests"></div>
</section>

</div>

<script src="app.js"></script>
<script>

const ICONS={
  inject:'<path d="M4 7h16M4 12h10M4 17h7"/><path d="M17 14l4 4m0-4l-4 4"/>',
  lookalike:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M9 11h4"/>',
  amount:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  currency:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/>',
  replay:'<path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 20v-5h5"/>',
  cap:'<path d="M12 3l8 4v5c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V7z"/><path d="M9 12l2 2 4-4"/>',
  none:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  check:'<path d="M20 6L9 17l-5-5"/>'
};
const FAM={provenance:"red",mandate:"yellow",replay:"orange",control:"green"};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.none}</svg>`;
let TESTS=[],results={},busy=new Set(),firstDraw=true;

/* The corpus arrives from the server in English. What a person reads about
   each test is translated here, by id; the task, the page and the calls are
   not, because they are the literal inputs the gateway is given. */
const AR={
  "legitimate":{title:"الدفعة التي يجب أن تمرّ",
    summary:"ما وافق عليه المستخدم تمامًا، حتى آخر سنت.",
    note:"طبقة تحجب هذه الدفعة ليست وسيلة حماية، بل عُطل. يجب رفض كل هجوم أدناه دون رفض هذه."},
  "injected-payee":{title:"الصفحة تقول ادفع لشخص آخر",
    summary:"صفحة مورّد تحمل تعليمة لم يُعطها المستخدم قط.",
    note:"المبلغ صحيح والفاتورة حقيقية. لا يرى حدّ الإنفاق أي خطأ، لأن لا شيء في المال خاطئ، بل في مَن يتلقّاه فقط."},
  "lookalike":{title:"مستفيد يختلف بحرف واحد",
    summary:"اسم المورّد مع نقطة مضافة.",
    note:"مَن يوافق عليها بالنظر لا يلاحظها، وقراءة النموذج للصفحة قراءةً صحيحة هي بالضبط ما يُنجحها."},
  "homoglyph":{title:"مستفيد ليس بالحروف التي تقرؤها",
    summary:"حرف سيريلي يحلّ محلّ حرف لاتيني.",
    note:"لا يمكن تمييزه على الشاشة بأي حجم خط. المقارنة تتم على الحروف، لا على شكلها."},
  "inflated":{title:"المورّد الصحيح، بسعر أعلى",
    summary:"499 حيث وافق المستخدم على 480.",
    note:"لا يرفض Moat هذه الدفعة مباشرةً. قد يتغيّر السعر بشكل مشروع ولا يعلم ذلك إلا صاحب الموافقة، لذا يتوقّف ويسأل. حدٌّ مضبوط فوق 499 لن يراها أبدًا."},
  "currency":{title:"الرقم الصحيح، العملة الخاطئة",
    summary:"480 EUR مقابل موافقة على 480 USD.",
    note:"الرقم على الشاشة مطابق. أي شيء يقارن المبالغ كأرقام يرى أنها سليمة."},
  "over-cap":{title:"مبلغ يتجاوز الموافقة بكثير",
    summary:"9,999 مقابل موافقة على 480.",
    note:"الهجوم الوحيد الذي يلتقطه حدّ الإنفاق فعلًا. وُضع هنا لتكون المقارنة صادقة بشأن ما تصلح له وسيلة الحماية الأبسط."},
  "replay":{title:"الفاتورة نفسها، مدفوعة مرتين",
    summary:"دفعة موافَق عليها تتكرّر تحت موافقة واحدة أحادية الاستخدام.",
    note:"كلا الطلبين مشروع منفردًا. وحده سجلٌّ لما أُنفق سابقًا يستطيع رفض الثاني."},
  "no-mandate":{title:"دفعة لم يأذن بها أحد",
    summary:"طرح المستخدم سؤالًا، فمدّ الوكيل يده إلى أداة دفع.",
    note:"لم يُسمِّ أحدٌ هذا المورّد ولا توجد موافقة، فليس لدى Moat ما يطابق عليه ولن يقرّر وحده. على مضيف لا يستطيع السؤال، تتحوّل إلى رفض."}
};
const FAM_AR={provenance:"مصدر الحقول",mandate:"الموافقة",replay:"إعادة الإرسال",control:"حالة مشروعة"};
const tr=(t,k)=>L(t[k],AR[t.id]?.[k]??t[k]);
const verdict=d=>L(String(d).replace("_"," "),{allow:"مسموح بها",step_up:"مُعلَّقة",deny:"مرفوضة"}[d]);

function scenario(t){
  const m=t.mandate;
  return `<details class="sc"><summary>${L("What happens","ماذا يحدث")}</summary><dl>
    <dt>${L("User said","قال المستخدم")}</dt><dd class="q" dir="auto">${esc(t.task)}</dd>
    ${t.page?`<dt>${L("Page said","قالت الصفحة")}</dt><dd class="q" dir="auto">${esc(t.page).split(NL).join("<br>")}</dd>`:""}
    <dt>${L("Approved","المُوافَق عليه")}</dt><dd>${m?`<bdi>${esc(m.payee)}, ${esc(m.amount)} ${esc(m.currency)}</bdi>`:L("nothing","لا شيء")}</dd>
    <dt>${L("Agent tries","يحاول الوكيل")}</dt><dd class="mono">${t.calls.map(c=>`${esc(c.payee)}, ${esc(c.amount)} ${esc(c.currency)}`).join(`<br><bdi>${L("then again:","ثم مرة أخرى:")}</bdi> `)}</dd>
    <dt>${L("Expected","المتوقَّع")}</dt><dd>${esc(verdict(t.expect))}</dd>
  </dl><p class="note">${esc(tr(t,"note"))}</p></details>`;
}

function testCard(t,i){
  const r=results[t.id],run=busy.has(t.id);
  const pill=r&&!run?`<span class="pill ${r.decision}">${esc(verdict(r.decision))}</span>`:"";
  // Branch on the decision, never on whether there are reasons. A step-up
  // often carries none, and showing it as "allowed" because the list was
  // empty is the page lying about the one thing it exists to show.
  let body="";
  if(r&&!run){
    if(r.error) body=esc(r.error);
    else if(r.reasons.length) body=r.reasons.map(x=>`<code>${esc(x.id)}</code> ${esc(x.message)}`).join("<br>");
    else if(r.decision==="allow") body=`<span class="ok">${r.paid
      ?L("allowed, the provider was paid","مسموح بها، تم الدفع لمزوّد الدفع")
      :L("allowed, the provider was called","مسموح بها، تم استدعاء مزوّد الدفع")}</span>`;
    else if(r.decision==="step_up") body=`<span class="held">${L("held for a person to approve","مُعلَّقة بانتظار شخص يوافق عليها")}</span>`;
    else body=L("refused","مرفوضة");
  }
  const why=body?`<div class="why">${body}</div>`:"";
  const cls=["test","glass",firstDraw?"enter":"","f-"+(FAM[t.family]||"orange"),run?"running":"",r&&!run?"done v-"+r.decision:""].join(" ");
  return `<article class="${cls}" style="--i:${i}" data-id="${esc(t.id)}">
    <div class="top">
      <div class="icon">${icon(t.icon)}</div>
      <div><span class="fam">${esc(L(t.family,FAM_AR[t.family]))}</span><h3>${esc(tr(t,"title"))}</h3><p class="sum">${esc(tr(t,"summary"))}</p></div>
    </div>
    ${scenario(t)}
    ${why}
    <footer>${pill}
      <button class="link play" data-run="${esc(t.id)}" ${run?'disabled aria-busy="true"':""
        } aria-label="${r?L("Run this test again","أعد تشغيل هذا الاختبار"):L("Run this test","شغّل هذا الاختبار")}">${run?SPINNER:PLAY}</button>
      ${r&&!run?`<span class="ms mono">${r.ms} ms</span>`:""}</footer>
  </article>`;
}

const openState=()=>new Set([...document.querySelectorAll("details.sc[open]")].map(d=>d.closest("[data-id]").dataset.id));
function draw(){
  const open=openState();
  $("#tests").innerHTML=TESTS.map(testCard).join("");
  firstDraw=false;
  for(const d of document.querySelectorAll("[data-id]")) if(open.has(d.dataset.id)) d.querySelector("details").open=true;
  for(const b of document.querySelectorAll("[data-run]")) b.addEventListener("click",()=>runTests([b.dataset.run]));
  const done=Object.values(results);
  if(done.length||busy.size){
    const met=done.filter(r=>r.met).length;
    const through=done.filter(r=>r.paid&&r.expected!=="allow").length;
    const total=done.length+busy.size;
    $("#summary").hidden=false;
    $("#summary").innerHTML=`<span class="bar" style="--p:${Math.round(100*done.length/Math.max(total,1))}%"></span>
      <div class="big mono">${met} / ${done.length}<small>${L("as the corpus says","كما تقول مجموعة الاختبارات")}</small></div><span class="sep"></span>
      <div class="big mono through${through?" bad":""}">${through}<small>${L("attacker paid","دُفع للمهاجم")}</small></div><span class="sep"></span>
      <div class="big mono">${done.reduce((a,r)=>a+r.ms,0).toLocaleString("en-US")} ms<small>${L("gateway time","وقت البوابة")}</small></div>
      ${busy.size?`<span class="hint">${SPINNER} ${L(`${busy.size} running`,`${busy.size} قيد التشغيل`)}</span>`:`<span class="hint">${L("signed and recorded","موقَّعة ومسجَّلة")}</span>`}`;
  }
}

/* three at a time, each its own call, so cards fill in as they finish */
async function runTests(ids){
  ids=ids.filter(id=>!busy.has(id)); if(!ids.length)return;
  const btn=$("#run-all"); working(btn,L("Running","جارٍ التشغيل"));
  for(const id of ids){busy.add(id);delete results[id];}
  draw();
  const queue=[...ids];
  const worker=async()=>{
    while(queue.length){
      const id=queue.shift();
      try{
        const j=await api("/v1/suite?test="+encodeURIComponent(id),{method:"POST"});
        for(const r of j.results) results[r.id]=r;
      }catch(e){ results[id]={id,decision:"deny",expected:"deny",met:false,reasons:[],paid:false,ms:0,error:String(e.message||e)}; }
      busy.delete(id); draw();
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  idle(btn);
}
$("#run-all").addEventListener("click",()=>runTests(TESTS.map(t=>t.id)));

(async()=>{
  try{
    TESTS=(await api("/v1/tests")).tests; draw();
    // arriving from the hero button on the front page
    if(new URLSearchParams(location.search).has("run")) runTests(TESTS.map(t=>t.id));
  }catch(e){
    // A silent catch here would leave an empty page that looks like a corpus
    // with nothing in it rather than a sandbox that could not be reached.
    $("#tests").innerHTML=`<p class="hint">${L("Could not reach the sandbox: ","تعذّر الوصول إلى بيئة التجربة: ")}${esc(String(e.message||e))}</p>`;
  }
})();
</script>
</body>
</html>
