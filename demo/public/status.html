<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moat, API status</title>
<meta name="ar-title" content="moat، حالة الواجهة البرمجية">
<meta name="description" content="Live status and round-trip latency for every endpoint the public sandbox exposes.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&family=Ubuntu+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css?v=cbb4282">
<link rel="stylesheet" href="i18n.css">
<link rel="stylesheet" href="footer.css">
<script src="i18n.js"></script>
<style>
/* Right to left. The strip is a timeline and stays one: oldest on the left,
   today on the right, with its two captions under the matching ends. */
html[dir="rtl"] .strip,html[dir="rtl"] .strip-ends{direction:ltr}
html[dir="rtl"] .summary .bar{left:auto;right:0}
html[dir="rtl"] .rows .row{text-align:right}
html[dir="rtl"] .row-e{margin-left:0;margin-right:9px}
html[dir="rtl"] .row-r{text-align:left}
html[dir="rtl"] .check{text-align:right}
html[dir="rtl"] .check .code{text-align:left}
@media(max-width:700px){
  html[dir="rtl"] .rows .row,html[dir="rtl"] .row-r{text-align:center}
}
@media(max-width:560px){
  html[dir="rtl"] .check .code{text-align:right}
}
</style>
</head>
<body>

<nav></nav>

<div class="wrap">

<section class="tight">
  <div class="headrow"><h2 data-ar="ثلاثون يومًا">Thirty days</h2></div>
  <div class="panel glass">
    <div class="ph"><h3 id="uptime-h" data-ar="التوفّر">Availability</h3></div>
    <div class="pb">
      <div class="strip" id="strip"></div>
      <div class="strip-ends"><span id="strip-from"></span><span id="strip-to" data-ar="اليوم">today</span></div>
    </div>
  </div>

  <div class="rows" id="days" style="margin-top:14px"></div>
  <div class="row" style="justify-content:center;margin-top:12px">
    <button class="btn ghost" id="more" hidden></button>
  </div>
  <p class="hint foot-note" id="days-note" hidden></p>
</section>

<section class="tight">
  <div class="headrow">
    <h2 data-ar="الآن">Right now</h2>
    <!-- Labelled from script, not data-ar: the first run starts before the
         page's Arabic is applied, and would put the English back when idle. -->
    <button class="btn" id="recheck">Run the checks</button>
  </div>
  <div class="summary glass" id="summary" hidden><span class="bar"></span></div>
  <div class="panel glass"><div class="ph" data-ar="نقاط الاتصال">Endpoints</div><div class="pb">
    <div class="checks" id="checks"></div>
    <p class="hint foot-note" id="origin"></p>
  </div></div>
</section>

</div>

<script src="app.js"></script>
<script>
/* The strip. One column a day, coloured by how much of that day the gateway
   answered. Today is drawn faintly because it is still being counted, and a
   day with no samples at all is drawn as a gap rather than as green. */
const note = (sel, text) => { const el = $(sel); el.textContent = text; el.hidden = !text; };
/* Arabic counts its days: one, two, three to ten, eleven and up. */
const daysAr = (n) => n === 1 ? "يوم واحد" : n === 2 ? "يومين" : n >= 3 && n <= 10 ? `${n} أيام` : `${n} يومًا`;

(async () => {
  try {
    const u = await api("/v1/uptime");
    const bars = u.days.map((d) => {
      const pct = d.ratio === null ? null : Math.round(d.ratio * 1000) / 10;
      const colour = pct === null ? "var(--line)"
        : pct >= 99.5 ? "var(--green-l)"
        : pct >= 95 ? "var(--yellow-l)"
        : "var(--red-l)";
      const title = pct === null ? `${d.date}: ${L("not measured", "لم يُقَس")}`
        : d.declared ? `${d.date}: ${L("up, stated rather than measured", "يعمل، مُصرَّح به لا مَقيس")}`
        : `${d.date}: ${pct}%${d.partial ? L(" so far today", " حتى الآن اليوم") : ""}`;
      const cls = d.declared ? " declared" : d.partial ? " partial" : "";
      return `<span class="day${cls}" style="background:${colour}" title="${esc(title)}"></span>`;
    });
    $("#strip").innerHTML = bars.join("");
    $("#strip-from").textContent = u.days[0].date;

    // Declared days are not evidence, so they stay out of the headline number.
    const whole = u.days.filter((d) => !d.partial && !d.declared && d.expected);
    const ok = whole.reduce((a, d) => a + d.ok, 0);
    const exp = whole.reduce((a, d) => a + d.expected, 0);
    $("#uptime-h").textContent = exp
      ? L(`Availability, ${(100 * ok / exp).toFixed(2)}% over ${whole.length} day${whole.length === 1 ? "" : "s"}`,
          `التوفّر: ${(100 * ok / exp).toFixed(2)}% على مدى ${daysAr(whole.length)}`)
      : L("Availability", "التوفّر");

    /* The strip answers "was it up"; the list answers "what happened on the
       ninth". Days nobody measured are left out rather than listed as zero. */
    const measured = u.days.filter((d) => d.ratio !== null).slice().reverse();

    /* Five is a glance. The rest is a click, because a month of rows pushes
       the live checks off the page for a reader who only wanted to know
       whether yesterday was fine. */
    const PAGE = 5;
    let shown = PAGE;
    /* A day is its date and its figure. How that figure is arrived at is the
       recorder's business, not the reader's: nobody came here to be told
       about minutes or denominators. The one thing worth keeping is whether
       a day was measured or stated, because that changes what the number is
       worth. */
    const dayRow = (d) => {
      const pct = Math.round(d.ratio * 1000) / 10;
      const colour = pct >= 99.5 ? "var(--green-l)" : pct >= 95 ? "var(--yellow-l)" : "var(--red-l)";
      const when = new Date(d.date + "T00:00:00Z").toLocaleDateString(L(undefined, "ar-DZ"),
        { weekday: "short", day: "numeric", month: "short" });
      return `<article class="row">
        <span class="row-i" style="color:${colour}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/></svg>
        </span>
        <div class="row-t">
          <h3>${esc(when)}${d.partial ? ` <span class="row-e">${L("so far today", "حتى الآن اليوم")}</span>`
            : d.declared ? ` <span class="row-e">${L("declared", "مُصرَّح به")}</span>` : ""}</h3>
          <p class="row-s mono">${esc(d.date)}${d.declared ? ` · <bdi>${L("stated, not sampled", "مُصرَّح به، بلا عيّنات")}</bdi>` : ""}</p>
        </div>
        <span class="row-r" style="color:${colour};font-size:1.1rem">${pct}%</span>
      </article>`;
    };

    const draw = () => {
      $("#days").innerHTML = measured.slice(0, shown).map(dayRow).join("");
      const left = measured.length - shown;
      const more = $("#more");
      more.hidden = left <= 0;
      more.textContent = L(`Show ${Math.min(left, PAGE)} more of ${left}`, `اعرض ${Math.min(left, PAGE)} أخرى من ${left}`);
    };
    $("#more").addEventListener("click", () => { shown += PAGE; draw(); });
    draw();
  } catch (e) {
    note("#days-note", L("Could not read the record: ", "تعذّرت قراءة السجل: ") + String(e.message || e));
  }
})();
</script>
<script>

/* The flow an agent actually walks, in order. Later steps need the sandbox
   the earlier ones made, so this is a sequence rather than a fan-out, and
   the timings are round trips from this browser: the network is in them. */
const FLOW=[
  {m:"GET",    p:()=>"/v1/limits",                     init:()=>({})},
  {m:"GET",    p:()=>"/v1/tests",                      init:()=>({})},
  {m:"POST",   p:()=>"/v1/sandbox",                    init:()=>({method:"POST"}), keep:j=>({id:j.id})},
  {m:"POST",   p:s=>`/v1/sandbox/${s.id}/intent`,      init:()=>body({text:"Pay the Northwind Cloud Co invoice INV-4471 for 480 USD."})},
  {m:"POST",   p:s=>`/v1/sandbox/${s.id}/authorization`,init:()=>body({payee:"Northwind Cloud Co",amount:"480",currency:"USD"}), keep:j=>({auth:j.authorization_id})},
  {m:"POST",   p:s=>`/v1/sandbox/${s.id}/pay`,         init:s=>body({payee:"Northwind Cloud Co",amount:480,currency:"USD",authorization_id:s.auth})},
  {m:"GET",    p:s=>`/v1/sandbox/${s.id}/evidence`,    init:()=>({})},
  {m:"DELETE", p:s=>`/v1/sandbox/${s.id}`,             init:()=>({method:"DELETE"})},
];
const body=o=>({method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(o)});
/* split rather than a regex: the id is always the fourth segment */
function label(p){
  const parts=p.split("/");
  if(parts[1]==="v1"&&parts[2]==="sandbox"&&parts[3]) parts[3]="{id}";
  return parts.join("/");
}

const codeText=c=>c==="skip"?L("skip","تخطٍّ"):c==="error"?L("error","خطأ"):String(c);

function draw(rows,running){
  $("#checks").innerHTML=rows.map(r=>`<div class="check ${r.state||""}">
      <span class="verb ${esc(r.m.toLowerCase())}">${esc(r.m)}</span>
      <span class="path mono">${esc(r.path)}</span>
      <span class="ms mono">${r.ms==null?"":r.ms+" ms"}</span>
      <span class="code mono">${r.code==null?(running?SPINNER:""):esc(codeText(r.code))}</span>
    </div>`).join("");
}

function summarise(rows){
  const done=rows.filter(r=>r.code!=null);
  if(!done.length) return;
  // a slow endpoint still answered; only a non-2xx has not
  const ok=done.filter(r=>r.state==="up"||r.state==="slow").length;
  const times=done.map(r=>r.ms).filter(n=>n!=null).sort((a,b)=>a-b);
  const median=times.length?times[Math.floor(times.length/2)]:0;
  const slowest=times.length?times[times.length-1]:0;
  $("#summary").hidden=false;
  $("#summary").innerHTML=`<span class="bar" style="--p:${Math.round(100*done.length/rows.length)}%"></span>
    <div class="big mono ${ok===done.length?"through":"through bad"}">${ok} / ${done.length}<small>${L("responding","تستجيب")}</small></div><span class="sep"></span>
    <div class="big mono">${median} ms<small>${L("median round trip","وسيط زمن الذهاب والإياب")}</small></div><span class="sep"></span>
    <div class="big mono">${slowest} ms<small>${L("slowest","الأبطأ")}</small></div>`;
}

async function run(){
  const btn=$("#recheck");
  working(btn,L("Checking","جارٍ الفحص"));

  const rows=FLOW.map(f=>({m:f.m,path:"",ms:null,code:null,state:null}));
  let state={};
  for(let i=0;i<FLOW.length;i++){
    const f=FLOW[i];
    let path;
    try{ path=f.p(state); }catch{ path=L("(needs an earlier step)","(تحتاج خطوة سابقة)"); }
    rows[i].path=label(path);
    draw(rows,true);
    // a step whose sandbox never got made cannot be called
    if(path.includes("undefined")){ rows[i].code="skip"; rows[i].state="down"; continue; }
    const t0=performance.now();
    try{
      const res=await fetch(path,f.init(state));
      const ms=Math.round(performance.now()-t0);
      rows[i].ms=ms; rows[i].code=res.status;
      rows[i].state=!res.ok?"down":(ms>2500?"slow":"up");
      const j=await res.json().catch(()=>({}));
      if(f.keep&&res.ok) state={...state,...f.keep(j)};
    }catch(e){
      rows[i].ms=Math.round(performance.now()-t0);
      rows[i].code="error"; rows[i].state="down";
    }
    draw(rows,true); summarise(rows);
  }
  draw(rows,false); summarise(rows);

  const up=rows.filter(r=>r.state==="up"||r.state==="slow").length;

  idle(btn);
}

$("#origin").innerHTML=L("Checked against "+esc(location.origin)+", from this browser, so the network between you and it is included.",
  `فُحصت مقابل <bdi>${esc(location.origin)}</bdi> من هذا المتصفح، لذا فالشبكة بينك وبينه داخلة في الأزمنة.`);
$("#recheck").textContent=L("Run the checks","شغّل الفحوص");
$("#recheck").addEventListener("click",run);
run();
</script>
</body>
</html>
