        @keyframes a-leg{

        }

          0%,66.8%{opacity:0;transform:scale(.7)} 68%{opacity:1;transform:scale(1)}

        }
        </style>

        <line class="a-line a-wire" x1="70"  y1="52" x2="112" y2="52"/>
        <line class="a-line a-wire" x1="182" y1="52" x2="230" y2="52"/>
        <line class="a-line a-wire" x1="294" y1="52" x2="348" y2="52"/>

        <!-- you -->
        <rect class="a-line" x="10" y="30" width="54" height="44" rx="13"/>

        <path class="a-ink" d="M27 64 a10 10 0 0 1 20 0"/>
        <text class="a-lbl" x="37" y="94">YOU</text>

        <!-- the agent -->

        <path class="a-ink" d="M132 46 l7 6 -7 6"/>
        <rect class="a-cur" x="143" y="56" width="12" height="2.6" rx="1.3"/>
        <text class="a-lbl" x="147" y="94">AGENT</text>

        <rect class="a-line" x="354" y="30" width="54" height="44" rx="13"/>
        <rect x="366" y="42" width="30" height="20" rx="4" fill="none" stroke="var(--ink-2)" stroke-width="2.2"/>
        <path class="a-ink" d="M366 49 H396"/>
        <text class="a-lbl" x="381" y="94">PAYEE</text>

        <!-- act one: allowed, and the payee is paid -->
        <g class="a-leg" style="--d:26px;animation-delay:.2s" ><rect x="70"  y="48" width="16" height="8" rx="4" fill="var(--ink-2)"/></g>
        <g class="a-leg" style="--d:32px;animation-delay:1.1s"><rect x="182" y="48" width="16" height="8" rx="4" fill="var(--ink-2)"/></g>

        <g class="a-leg" style="--d:32px;animation-delay:5.5s"  ><rect x="182" y="48" width="16" height="8" rx="4" fill="var(--ink-2)"/></g>
        <g class="a-leg" style="--d:-32px;animation-delay:6.5s" ><rect x="214" y="48" width="16" height="8" rx="4" fill="var(--red-l)"/></g>

        <!-- act three: held, carried back to you, and paid once you approve -->
        <g class="a-leg" style="--d:26px;animation-delay:8.4s"  ><rect x="70"  y="48" width="16" height="8" rx="4" fill="var(--ink-2)"/></g>
        <g class="a-leg" style="--d:32px;animation-delay:9.3s"  ><rect x="182" y="48" width="16" height="8" rx="4" fill="var(--ink-2)"/></g>
        <g class="a-leg" style="--d:-32px;animation-delay:10.3s"><rect x="214" y="48" width="16" height="8" rx="4" fill="var(--yellow-l)"/></g>
        <g class="a-leg" style="--d:-26px;animation-delay:11.2s"><rect x="96"  y="48" width="16" height="8" rx="4" fill="var(--yellow-l)"/></g>
        <g class="a-leg" style="--d:26px;animation-delay:12.6s" ><rect x="70"  y="48" width="16" height="8" rx="4" fill="var(--green-l)"/></g>
        <g class="a-leg" style="--d:32px;animation-delay:13.5s" ><rect x="182" y="48" width="16" height="8" rx="4" fill="var(--green-l)"/></g>

<script>


/* One prompt, three places to take it. Nothing is sent from here: these
   are links the visitor follows, with the question already written. */
function agentPrompt(b){
  return [
    "I want to test moat, a risk layer for AI agent payments. It runs a public sandbox at "+b+" with no key and no account.",
    "",
    "POST   /v1/sandbox                      -> {id}",
    "POST   /v1/sandbox/{id}/intent          {\"text\"}                                    what the user asked for",
    "POST   /v1/sandbox/{id}/authorization   {\"payee\",\"amount\",\"currency\"}              what an approver signed off",
    "POST   /v1/sandbox/{id}/pay             {\"payee\",\"amount\",\"currency\",\"authorization_id\"}",
    "GET    /v1/sandbox/{id}/evidence        the signed record of every verdict",
    "DELETE /v1/sandbox/{id}",
    "",
    "Create a sandbox, say the user asked to pay Aseer Cloud Co 480 USD, register that as the authorization, then try to get a payment through to a payee the user never named. Report the decision and the reasons it gives, then try to find an attempt it lets through that it should not.",
  ].join(String.fromCharCode(10));
}

(async()=>{
  const b=location.hostname === "moatgateway.dpdns.org"
    ? "https://api.moatgateway.dpdns.org" : location.origin;
  const prompt=agentPrompt(b);
  $("#ask-gpt").href="https://chatgpt.com/?q="+encodeURIComponent(prompt);
  $("#ask-claude").href="https://claude.ai/new?q="+encodeURIComponent(prompt);
  $("#ask-plx").href="https://www.perplexity.ai/search?q="+encodeURIComponent(prompt);
  $("#copy-curl").addEventListener("click",()=>copyText($("#curl").textContent,$("#copy-curl"),"Copied",$("#curl")));
  const H=`-H '<span class="s">content-type: application/json</span>'`;
  $("#curl").innerHTML=[
    '<span class="c"># a sandbox of your own</span>',
    `S=$(<span class="k">curl</span> -s -XPOST <span class="u">${b}/v1/sandbox</span> | jq -r .id)`,'',
    '<span class="c"># what the user asked for. A tool result never confers authority;</span>',
    '<span class="c"># the user and a signed authorization both do.</span>',
    `<span class="k">curl</span> -s -XPOST <span class="u">${b}/v1/sandbox/$S/intent</span> ${H} -d '{"text":"Pay the Aseer Cloud Co invoice INV-4471 for 480 USD."}'`,'',
    '<span class="c"># what an approver signed off. Keep the reply: the pay call has to</span>',
    '<span class="c"># carry it, or the refusal you get is the missing authorization</span>',
    '<span class="c"># rather than the substituted payee this is about.</span>',
    `A=$(<span class="k">curl</span> -s -XPOST <span class="u">${b}/v1/sandbox/$S/authorization</span> ${H} -d '{"payee":"Aseer Cloud Co","amount":"480","currency":"USD"}')`,'',
    '<span class="c"># now try to pay someone else, under the approval for Aseer</span>',
    `P=$(<span class="k">echo</span> "$A" | jq -c '{payee:"Qassim Trading Est",amount:480,currency:"USD",authorization_id,invoice_id}')`,
    `<span class="k">curl</span> -s -XPOST <span class="u">${b}/v1/sandbox/$S/pay</span> ${H} -d "$P"`,'',
    '<span class="c"># read back the signed record of every verdict</span>',
    `<span class="k">curl</span> -s -XGET <span class="u">${b}/v1/sandbox/$S/evidence</span>`,'',
    '<span class="c"># what this sandbox will let you do, and whether the chain demo is on</span>',
    `<span class="k">curl</span> -s -XGET <span class="u">${b}/v1/limits</span>`,'',
    '<span class="c"># the nine attacks the tests page runs, as data</span>',
    `<span class="k">curl</span> -s -XGET <span class="u">${b}/v1/tests</span>`,'',
    '<span class="c"># hand the sandbox back rather than waiting for it to expire</span>',
    `<span class="k">curl</span> -s -XDELETE <span class="u">${b}/v1/sandbox/$S</span>`,
  ].join(NL);
})();
</script>
