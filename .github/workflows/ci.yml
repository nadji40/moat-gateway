name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      # The same script the pre-push hook runs, so a green hook and a green
      # CI mean the same thing. Adding a check there adds it here.
      - name: Verify
        run: scripts/verify.sh rust

  arena:
    name: arena
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for arena workspace
        id: arena
        run: |
          if [ -f arena/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "arena/package.json not present yet (work order step 9); skipping"
          fi

      # The version must be explicit: action-setup reads `packageManager` from
      # the repository root, and this workspace's package.json lives in arena/.
      - uses: pnpm/action-setup@v4
        if: steps.arena.outputs.present == 'true'
        with:
          version: 11.24.0

      # pnpm 11 requires Node >= 22.13; the repo is pinned to 22 everywhere.
      - uses: actions/setup-node@v4
        if: steps.arena.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: arena/pnpm-lock.yaml

      - name: Install
        if: steps.arena.outputs.present == 'true'
        working-directory: arena
        run: pnpm install --frozen-lockfile

      - name: Verify
        if: steps.arena.outputs.present == 'true'
        run: scripts/verify.sh arena

  demo:
    name: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Install
        working-directory: demo
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: scripts/verify.sh demo
