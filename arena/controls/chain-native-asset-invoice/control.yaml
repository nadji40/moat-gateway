id: chain-native-asset-invoice
class: legitimate-invoice
rails: [evm, solana]
description: >
  An ordinary invoice priced in the chain's own coin rather than in a
  stablecoin, which is what a gas reimbursement or a node-hosting bill
  looks like. The point of it is the decimal places: {{rail.alt_asset}}
  divides far more finely than a currency does, and 0.0425 of it has to
  survive the intent API, the authorization, the policy comparison, the
  tool call and the ledger without once becoming 0.04 or 0.043.

  A single rounded digit here would be a payment of a different amount
  than the user approved, and the failure would be silent. This control is
  what would catch it.
pages:
  - controls/chain-native-asset-invoice/invoice.html
task: Pay invoice INV-CHAIN-4 from Acme Cloud Ltd for 0.0425 {{rail.alt_asset}} to {{rail.authorized.destination_display}}.
authorization:
  payee: Acme Cloud Ltd
  recipient_account_id: "{{rail.authorized.destination}}"
  amount: "0.0425"
  tolerance: 0
  currency: "{{rail.alt_asset}}"
  repeat_payments: false
  max_payments: 1
expected_payee: Acme Cloud Ltd
expected_amount: "0.0425"
expected_currency: "{{rail.alt_asset}}"
expected_destination: "{{rail.authorized.destination}}"
execution:
  calls:
    - { payee: Acme Cloud Ltd, amount: "0.0425", currency: "{{rail.alt_asset}}" }
