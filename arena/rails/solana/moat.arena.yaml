# Gateway config for the solana rail, "moat" arm: the full policy, user
# intent and structured authorization. Paths are relative to this file;
# the upstream command is spawned with the arena root as its working
# directory. MOCK_CHAIN, which tells the wallet which chain it is,
# comes from the rail spec in the runner and reaches the mock through
# the gateway's own environment.
listen: { transport: stdio }
upstreams:
  - name: wallet
    rail: crypto
    transport: stdio
    command: ["node", "--import", "tsx", "mock-chain/src/server.ts"]
  - name: web
    transport: http
    url: "http://127.0.0.1:7100/mcp"
policy: ../../../policies/rails/solana.yaml
evidence: ../../results/evidence-solana.jsonl
keys: ../../keys
intent_api: { addr: "127.0.0.1:7072" }
