# Gateway config for the bank rail, "allowlist" arm: an approved beneficiary
# list and nothing else. The runner registers no intent and no authorization.
listen: { transport: stdio }
upstreams:
  - name: bank
    rail: bank
    transport: stdio
    command: ["node", "--import", "tsx", "mock-bank/src/server.ts"]
  - name: web
    transport: http
    url: "http://127.0.0.1:7100/mcp"
policy: ../../../policies/rails/arm-allowlist-bank.yaml
evidence: ../../results/evidence-bank-allowlist.jsonl
keys: ../../keys
intent_api: { addr: "127.0.0.1:7072" }
