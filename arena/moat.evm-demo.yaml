# The Base Sepolia wallet behind the public try-it page.
#
# The same policy as the evm-testnet demonstration -- nothing approved in
# advance, every payment authorized through the intent API -- pointed at a
# separate, deliberately poor wallet. See demo/README.md for why the page
# is allowed to touch a real chain at all.
listen: { transport: stdio }
upstreams:
  - name: wallet
    rail: crypto
    transport: stdio
    # No --env-file: the wallet's environment is inherited from whatever
    # starts the demo service, which is `pnpm start` locally and an
    # EnvironmentFile under systemd. That keeps the secret in one place
    # per host rather than at a path this config has to guess.
    command: ["node", "--import", "tsx", "evm-testnet/src/server.ts"]
policy: ../policies/rails/evm-testnet.yaml
evidence: ./results/demo-chain-evidence.jsonl
keys: ./keys
intent_api: { addr: "127.0.0.1:7091" }
